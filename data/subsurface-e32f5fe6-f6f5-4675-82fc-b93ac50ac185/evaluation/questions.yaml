# Evaluation Dataset for scientific data catalogs-Vis -- PMG Subsurface Gas
# Dataset: Subsurface Gas Intrusion Monitoring at an urban university campus (PMG)
# Source: an anonymized data repository -- DOI: [withheld for double-blind review]
# Data file: pmg_sample.csv  (produced by prepare_pmg.py; `date` renamed to `time`)
# Domain: groundwater / urban subsurface gas monitoring
#
# Columns: building, well, depth_level (categorical); time (datetime);
#   ch4 (methane), ch4_peak (methane peak), co2 (carbon dioxide), o2 (oxygen),
#   h2s (hydrogen sulfide), co (carbon monoxide), bal (balance gas),
#   well pressure, voc (volatile organic compounds), lel (lower explosive limit);
#   field_notes, comments (free text, not queried).
#
#   methane->ch4, carbon dioxide->co2, oxygen->o2, hydrogen sulfide->h2s,
#   carbon monoxide->co (NOT co2), volatile organic compounds->voc,
#   lower explosive limit->lel, balance gas->bal, methane peak->ch4_peak.

version: "1.0"
description: "50 evaluation questions for the PMG subsurface gas dataset (an urban university campus)"
dataset: "PMG-SUBSURFACE-GAS-the campus-a university"

questions:
  # ===== COMPUTED (10) =====
  - id: comp_001
    question: "Show the distribution of the methane to carbon dioxide ratio"
    expected_query_contains: ["ch4", "co2"]
    expected_columns: ["ch4", "co2"]
    expected_query: "df.assign(ch4_co2_ratio=df['ch4'] / df['co2'])[['ch4_co2_ratio']]"
    expected_viz: "histogram"
    expected_x: "ch4_co2_ratio"
    expected_y: null
    category: "computed"
  - id: comp_002
    question: "Plot the cumulative methane readings over time"
    expected_query_contains: ["cumsum", "ch4"]
    expected_columns: ["time", "ch4"]
    expected_query: "df[['time']].assign(cum_ch4=df['ch4'].cumsum())"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "cum_ch4"
    category: "computed"
  - id: comp_003
    question: "Plot the difference between the methane peak and the methane reading over time"
    expected_query_contains: ["ch4_peak", "ch4"]
    expected_columns: ["time", "ch4_peak", "ch4"]
    expected_query: "df[['time']].assign(ch4_diff=df['ch4_peak'] - df['ch4'])"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "ch4_diff"
    category: "computed"
  - id: comp_004
    question: "Show the ratio of carbon dioxide to oxygen over time"
    expected_query_contains: ["co2", "o2"]
    expected_columns: ["time", "co2", "o2"]
    expected_query: "df[['time']].assign(co2_o2_ratio=df['co2'] / df['o2'])"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "co2_o2_ratio"
    category: "computed"
  - id: comp_005
    question: "Show the distribution of the methane peak to methane ratio"
    expected_query_contains: ["ch4_peak", "ch4"]
    expected_columns: ["ch4_peak", "ch4"]
    expected_query: "df.assign(peak_ratio=df['ch4_peak'] / df['ch4'])[['peak_ratio']]"
    expected_viz: "histogram"
    expected_x: "peak_ratio"
    expected_y: null
    category: "computed"
  - id: comp_006
    question: "Plot the cumulative carbon dioxide readings over time"
    expected_query_contains: ["cumsum", "co2"]
    expected_columns: ["time", "co2"]
    expected_query: "df[['time']].assign(cum_co2=df['co2'].cumsum())"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "cum_co2"
    category: "computed"
  - id: comp_007
    question: "Show the distribution of the ratio of volatile organic compounds to methane"
    expected_query_contains: ["voc", "ch4"]
    expected_columns: ["voc", "ch4"]
    expected_query: "df.assign(voc_ch4_ratio=df['voc'] / df['ch4'])[['voc_ch4_ratio']]"
    expected_viz: "histogram"
    expected_x: "voc_ch4_ratio"
    expected_y: null
    category: "computed"
  - id: comp_008
    question: "Show the difference between carbon dioxide and oxygen over time"
    expected_query_contains: ["co2", "o2"]
    expected_columns: ["time", "co2", "o2"]
    expected_query: "df[['time']].assign(co2_o2_diff=df['co2'] - df['o2'])"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "co2_o2_diff"
    category: "computed"
  - id: comp_009
    question: "Show the distribution of hydrogen sulfide relative to methane"
    expected_query_contains: ["h2s", "ch4"]
    expected_columns: ["h2s", "ch4"]
    expected_query: "df.assign(h2s_ch4_ratio=df['h2s'] / df['ch4'])[['h2s_ch4_ratio']]"
    expected_viz: "histogram"
    expected_x: "h2s_ch4_ratio"
    expected_y: null
    category: "computed"
  - id: comp_010
    question: "Show weekly measurement counts over the study period"
    expected_query_contains: ["groupby", "count"]
    expected_columns: ["time"]
    expected_query: "df.groupby(df['time'].dt.to_period('W')).size().reset_index(name='count')"
    expected_viz: "histogram"
    expected_x: "time"
    expected_y: "count"
    category: "computed"

