    category: "grouping"

  - id: grp_004
    question: "What is the max VPD by year?"
    expected_query_contains: ["groupby", "year", "max", "VPD"]
    expected_columns: ["VPD_magnus_maximum"]
    expected_query: "df.groupby(df['time'].dt.year)['VPD_magnus_maximum'].max().reset_index()"
    expected_viz: "histogram"
