# Evaluation Dataset for scientific data catalogs-Vis
# 50 test questions for NL2Vis evaluation
# Dataset: NEE-METEORS Amazon (BR-Sa1) - a national research institute
# DOI: [withheld for double-blind review]
#
# Categories:
# - computed: Derived metrics, cumulative sums, filtered distributions
# - filtering: Filter by value, date range, condition
# - grouping: Group by temporal unit (month, year)
# - temporal: Time series, trends
# - distribution: Histograms, frequency analysis
# - correlation: Scatter plots, relationship analysis
#
# Expected visualization types:
# - line: Time series data
# - histogram: Distribution analysis
# - scatter: Correlation/relationship analysis

version: "2.0"
description: "Evaluation dataset for scientific data catalogs-Vis NL2Vis system using a national research institute BR-Sa1 flux tower data"
dataset: "NEE-METEORS-AMAZON_BRSa1_2002_2011"

questions:
  # ===== DERIVED/COMPUTED QUERIES (10) =====
  # Note: Renamed from "aggregation" - these questions produce actual
  # visualizations rather than scalar values, making them true NL2Vis tasks.

  - id: comp_001
    question: "Show the distribution of daily temperature range"
    expected_query_contains: ["t2m_maximum", "t2m_minimum"]
    expected_columns: ["t2m_maximum", "t2m_minimum"]
    expected_query: "df.assign(temp_range=df['t2m_maximum'] - df['t2m_minimum'])[['temp_range']]"
    expected_viz: "histogram"
    expected_x: "temp_range"
    expected_y: null
    category: "computed"

  - id: comp_002
    question: "Plot the cumulative precipitation over time"
    expected_query_contains: ["cumsum", "prec"]
    expected_columns: ["time", "prec"]
    expected_query: "df[['time']].assign(cumprec=df['prec'].cumsum())"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "cumprec"
    category: "computed"

  - id: comp_003
    question: "Show monthly observation counts over the study period"
    expected_query_contains: ["groupby", "count", "month"]
    expected_columns: ["time"]
    expected_query: "df.groupby(df['time'].dt.to_period('M')).size().reset_index(name='count')"
    expected_viz: "histogram"
    expected_x: "time"
    expected_y: "count"
    category: "computed"

  - id: comp_004
    question: "Show the soil temperature standard deviation over time"
    expected_query_contains: ["stl1_std", "time"]
    expected_columns: ["time", "stl1_std"]
    expected_query: "df[['time', 'stl1_std']]"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "stl1_std"
    category: "computed"

  - id: comp_005
    question: "Compare daytime and nighttime land surface temperatures"
    expected_query_contains: ["LST_Day", "LST_Night"]
    expected_columns: ["LST_Day_1km", "LST_Night_1km"]
    expected_query: "df[['LST_Day_1km', 'LST_Night_1km']]"
    expected_viz: "scatter"
    expected_x: "LST_Day_1km"
    expected_y: "LST_Night_1km"
    category: "computed"

  - id: comp_006
    question: "Show the distribution of NEE measurements greater than 0.5"
    expected_query_contains: ["NEE", ">", "0.5"]
    expected_columns: ["NEE_CUT_REF"]
    expected_query: "df[df['NEE_CUT_REF'] > 0.5]['NEE_CUT_REF']"
    expected_viz: "histogram"
    expected_x: "NEE_CUT_REF"
    expected_y: null
    category: "computed"

  - id: comp_007
    question: "Plot the monthly average of vapor pressure deficit"
    expected_query_contains: ["groupby", "month", "VPD"]
    expected_columns: ["VPD_magnus_mean"]
    expected_query: "df.groupby(df['time'].dt.month)['VPD_magnus_mean'].mean().reset_index()"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "VPD_magnus_mean"
    category: "computed"

  - id: comp_008
    question: "Show the distribution of Leaf Area Index values"
    expected_query_contains: ["Lai"]
    expected_columns: ["Lai"]
    expected_query: "df['Lai']"
    expected_viz: "histogram"
    expected_x: "Lai"
    expected_y: null
    category: "computed"

  - id: comp_009
    question: "Plot the relationship between EVI and LAI"
    expected_query_contains: ["EVI", "Lai"]
    expected_columns: ["EVI", "Lai"]
    expected_query: "df[['EVI', 'Lai']]"
    expected_viz: "scatter"
    expected_x: "EVI"
    expected_y: "Lai"
    category: "computed"

  - id: comp_010
    question: "Show the distribution of FPAR values"
    expected_query_contains: ["Fpar"]
    expected_columns: ["Fpar"]
    expected_query: "df['Fpar']"
    expected_viz: "histogram"
    expected_x: "Fpar"
    expected_y: null
    category: "computed"

