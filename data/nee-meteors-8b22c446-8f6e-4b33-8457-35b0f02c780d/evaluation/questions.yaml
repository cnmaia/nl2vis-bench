  - id: temp_007
    question: "Plot the shortwave radiation over time"
    expected_query_contains: ["time", "sw"]
    expected_columns: ["time", "adj_sfc_sw_diff_all_daily"]
    expected_query: "df[['time', 'adj_sfc_sw_diff_all_daily']]"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "adj_sfc_sw_diff_all_daily"
    category: "temporal"

  - id: temp_008
    question: "Display the temporal evolution of PAR"
    expected_query_contains: ["time", "par"]
    expected_columns: ["time", "adj_sfc_par_diff_all_daily"]
    expected_query: "df[['time', 'adj_sfc_par_diff_all_daily']]"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "adj_sfc_par_diff_all_daily"
    category: "temporal"

  - id: temp_009
    question: "Show how the Enhanced Vegetation Index changed over time"
    expected_query_contains: ["time", "EVI"]
    expected_columns: ["time", "EVI"]
    expected_query: "df[['time', 'EVI']]"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "EVI"
    category: "temporal"

  - id: temp_010
    question: "What is the trend of dew point temperature over the years?"
    expected_query_contains: ["time", "d2m"]
    expected_columns: ["time", "d2m_mean"]
    expected_query: "df[['time', 'd2m_mean']]"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "d2m_mean"
    category: "temporal"

