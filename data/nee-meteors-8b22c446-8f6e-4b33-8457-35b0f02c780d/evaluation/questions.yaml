  - id: dist_005
    question: "What is the distribution of soil temperature?"
    expected_query_contains: ["stl1"]
    expected_columns: ["stl1_mean"]
    expected_query: "df['stl1_mean']"
    expected_viz: "histogram"
    expected_x: "stl1_mean"
