    expected_viz: "line"
    expected_x: "time"
    expected_y: "VPD_magnus_mean"
    category: "filtering"

  - id: flt_005
    question: "Show NEE data where the quality flag (NEE_CUT_REF_QC) is greater than 0.8"
    expected_query_contains: ["QC", ">", "0.8"]
    expected_columns: ["NEE_CUT_REF_QC"]
    expected_query: "df[df['NEE_CUT_REF_QC'] > 0.8][['time', 'NEE_CUT_REF']]"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "NEE_CUT_REF"
    category: "filtering"

# Evaluation metrics
metrics:
  - name: "translation_accuracy"
    description: "Percentage of queries that contain expected keywords"
    weight: 0.4

  - name: "column_accuracy"
    description: "Percentage of correct columns identified"
    weight: 0.3

  - name: "viz_accuracy"
    description: "Percentage of correct visualization types selected"
    weight: 0.2

  - name: "execution_success"
    description: "Percentage of queries that execute without errors"
    weight: 0.1
