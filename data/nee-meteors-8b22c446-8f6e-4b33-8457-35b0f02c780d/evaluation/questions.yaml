    expected_query_contains: ["d2m", "t2m"]
    expected_columns: ["d2m_mean", "t2m_mean"]
    expected_query: "df[['d2m_mean', 't2m_mean']]"
    expected_viz: "scatter"
    expected_x: "d2m_mean"
    expected_y: "t2m_mean"
    category: "correlation"

  # ===== GROUPING QUERIES (5) =====
  - id: grp_001
    question: "What is the average NEE by month?"
    expected_query_contains: ["groupby", "month", "mean", "NEE"]
    expected_columns: ["NEE_CUT_REF"]
    expected_query: "df.groupby(df['time'].dt.month)['NEE_CUT_REF'].mean().reset_index()"
    expected_viz: "histogram"
    expected_x: "time"
    expected_y: "NEE_CUT_REF"
    category: "grouping"

  - id: grp_002
    question: "Show the total precipitation by year"
    expected_query_contains: ["groupby", "year", "sum", "prec"]
    expected_columns: ["prec"]
    expected_query: "df.groupby(df['time'].dt.year)['prec'].sum().reset_index()"
    expected_viz: "histogram"
    expected_x: "time"
    expected_y: "prec"
