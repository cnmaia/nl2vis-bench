  - id: dist_004
    question: "Show how precipitation is distributed"
    expected_query_contains: ["prec"]
    expected_columns: ["prec"]
    expected_query: "df['prec']"
    expected_viz: "histogram"
    expected_x: "prec"
    expected_y: null
