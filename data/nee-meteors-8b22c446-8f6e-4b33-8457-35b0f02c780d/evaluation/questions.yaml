  - id: grp_003
    question: "Calculate average temperature per month"
    expected_query_contains: ["groupby", "month", "mean", "t2m"]
    expected_columns: ["t2m_mean"]
    expected_query: "df.groupby(df['time'].dt.month)['t2m_mean'].mean().reset_index()"
