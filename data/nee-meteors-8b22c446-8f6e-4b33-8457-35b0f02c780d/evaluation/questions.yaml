  # ===== FILTERING QUERIES (5) =====
  - id: flt_001
    question: "Show all records where NEE is positive (carbon source)"
    expected_query_contains: ["NEE", ">", "0"]
    expected_columns: ["NEE_CUT_REF"]
    expected_query: "df[df['NEE_CUT_REF'] > 0][['time', 'NEE_CUT_REF']]"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "NEE_CUT_REF"
    category: "filtering"

  - id: flt_002
    question: "Filter data for days with precipitation above 50mm"
    expected_query_contains: ["prec", ">", "50"]
    expected_columns: ["prec"]
    expected_query: "df[df['prec'] > 50][['time', 'prec']]"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "prec"
    category: "filtering"

  - id: flt_003
    question: "Show data from 2005"
    expected_query_contains: ["time", "2005"]
    expected_columns: ["time"]
    expected_query: "df[df['time'].dt.year == 2005][['time', 'NEE_CUT_REF']]"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "NEE_CUT_REF"
    category: "filtering"

  - id: flt_004
    question: "Get observations where VPD exceeds 15 hPa"
    expected_query_contains: ["VPD", ">", "15"]
