  # ===== CORRELATION QUERIES (10) =====
  - id: corr_001
    question: "Show the relationship between NEE and air temperature"
    expected_query_contains: ["NEE", "t2m"]
    expected_columns: ["NEE_CUT_REF", "t2m_mean"]
    expected_query: "df[['NEE_CUT_REF', 't2m_mean']]"
    expected_viz: "scatter"
    expected_x: "NEE_CUT_REF"
    expected_y: "t2m_mean"
    category: "correlation"

  - id: corr_002
    question: "Is there a correlation between vapor pressure deficit and NEE?"
    expected_query_contains: ["VPD", "NEE"]
    expected_columns: ["VPD_magnus_mean", "NEE_CUT_REF"]
    expected_query: "df[['VPD_magnus_mean', 'NEE_CUT_REF']]"
    expected_viz: "scatter"
    expected_x: "VPD_magnus_mean"
    expected_y: "NEE_CUT_REF"
    category: "correlation"

  - id: corr_003
    question: "Plot NEE versus precipitation"
    expected_query_contains: ["NEE", "prec"]
    expected_columns: ["NEE_CUT_REF", "prec"]
    expected_query: "df[['NEE_CUT_REF', 'prec']]"
    expected_viz: "scatter"
    expected_x: "NEE_CUT_REF"
    expected_y: "prec"
    category: "correlation"

  - id: corr_004
    question: "Show a scatter plot of PAR vs NEE"
    expected_query_contains: ["par", "NEE"]
    expected_columns: ["adj_sfc_par_diff_all_daily", "NEE_CUT_REF"]
    expected_query: "df[['adj_sfc_par_diff_all_daily', 'NEE_CUT_REF']]"
    expected_viz: "scatter"
    expected_x: "adj_sfc_par_diff_all_daily"
    expected_y: "NEE_CUT_REF"
    category: "correlation"

  - id: corr_005
    question: "What is the relationship between temperature and VPD?"
    expected_query_contains: ["t2m", "VPD"]
    expected_columns: ["t2m_mean", "VPD_magnus_mean"]
    expected_query: "df[['t2m_mean', 'VPD_magnus_mean']]"
    expected_viz: "scatter"
    expected_x: "t2m_mean"
    expected_y: "VPD_magnus_mean"
    category: "correlation"

  - id: corr_006
    question: "Compare soil temperature against air temperature"
    expected_query_contains: ["stl1", "t2m"]
    expected_columns: ["stl1_mean", "t2m_mean"]
    expected_query: "df[['stl1_mean', 't2m_mean']]"
    expected_viz: "scatter"
    expected_x: "stl1_mean"
    expected_y: "t2m_mean"
    category: "correlation"

  - id: corr_007
    question: "Show NDVI versus precipitation relationship"
    expected_query_contains: ["NDVI", "prec"]
    expected_columns: ["NDVI", "prec"]
    expected_query: "df[['NDVI', 'prec']]"
