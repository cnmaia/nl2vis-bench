# Evaluation Dataset for scientific data catalogs-Vis -- Campinas Aerosol (merged instruments)
# Dataset: LFA Intensive Field Experiments -- Campinas aerosol properties 2017-2018 (L3)
# Source: an anonymized data repository -- DOI: [withheld for double-blind review]
# Data file: campinas_merged_sample.csv  (produced by merge_instruments.py)
# Domain: atmospheric aerosols / optical & physical properties
#
#   time            UTC timestamp (30 min)
#   conc            aerosol number concentration            [CPC]
#   BC637           black carbon concentration              [MAAP]
#   Abs637          absorption coefficient at 637 nm        [MAAP]
#   scat450/525/635 aerosol scattering coefficients (blue/green/red)  [Nephelometer]
#   Angstrom        Angstrom exponent                       [Nephelometer]
#   SSA637          single scattering albedo at 637 nm      [Nephelometer]
#   total_conc_smps total particle number concentration     [SMPS]
#   total_volume    total particle volume                   [SMPS]
#   mean_diameter   mean particle diameter                  [SMPS]
#
#   black carbon->BC637, absorption coefficient->Abs637, blue/green/red scattering->
#   scat450/525/635, Angstrom exponent->Angstrom, single scattering albedo->SSA637,
#   particle number concentration->conc (ambiguous with total_conc_smps; see equivalence).

version: "1.0"
description: "50 evaluation questions for the merged Campinas aerosol dataset (L3, 30min)"
dataset: "CAMPINAS-AEROSOL-LFA-2017-2018-L3"

questions:
  # ===== COMPUTED (10) =====
  - id: comp_001
    question: "Show the distribution of the ratio of blue to red scattering"
    expected_query_contains: ["scat450", "scat635"]
    expected_columns: ["scat450", "scat635"]
    expected_query: "df.assign(blue_red_ratio=df['scat450'] / df['scat635'])[['blue_red_ratio']]"
    expected_viz: "histogram"
    expected_x: "blue_red_ratio"
    expected_y: null
    category: "computed"
  - id: comp_002
    question: "Plot the cumulative black carbon concentration over time"
    expected_query_contains: ["cumsum", "BC637"]
    expected_columns: ["time", "BC637"]
    expected_query: "df[['time']].assign(cum_bc=df['BC637'].cumsum())"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "cum_bc"
    category: "computed"
  - id: comp_003
    question: "Show the difference between blue and red scattering over time"
    expected_query_contains: ["scat450", "scat635"]
    expected_columns: ["time", "scat450", "scat635"]
    expected_query: "df[['time']].assign(scat_diff=df['scat450'] - df['scat635'])"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "scat_diff"
    category: "computed"
  - id: comp_004
    question: "Show the ratio of light absorption to red scattering over time"
    expected_query_contains: ["Abs637", "scat635"]
    expected_columns: ["time", "Abs637", "scat635"]
    expected_query: "df[['time']].assign(abs_scat_ratio=df['Abs637'] / df['scat635'])"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "abs_scat_ratio"
    category: "computed"
  - id: comp_005
    question: "Show the distribution of the black-carbon-to-scattering ratio"
    expected_query_contains: ["BC637", "scat635"]
    expected_columns: ["BC637", "scat635"]
    expected_query: "df.assign(bc_scat_ratio=df['BC637'] / df['scat635'])[['bc_scat_ratio']]"
    expected_viz: "histogram"
    expected_x: "bc_scat_ratio"
    expected_y: null
    category: "computed"
  - id: comp_006
    question: "Plot the cumulative total particle volume over time"
    expected_query_contains: ["cumsum", "total_volume"]
    expected_columns: ["time", "total_volume"]
    expected_query: "df[['time']].assign(cum_volume=df['total_volume'].cumsum())"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "cum_volume"
    category: "computed"
  - id: comp_007
    question: "Show the distribution of average particle volume per particle"
    expected_query_contains: ["total_volume", "total_conc_smps"]
    expected_columns: ["total_volume", "total_conc_smps"]
    expected_query: "df.assign(vol_per_particle=df['total_volume'] / df['total_conc_smps'])[['vol_per_particle']]"
    expected_viz: "histogram"
    expected_x: "vol_per_particle"
    expected_y: null
    category: "computed"
  - id: comp_008
    question: "Show the difference between green and red scattering over time"
    expected_query_contains: ["scat525", "scat635"]
    expected_columns: ["time", "scat525", "scat635"]
    expected_query: "df[['time']].assign(green_red_diff=df['scat525'] - df['scat635'])"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "green_red_diff"
    category: "computed"
  - id: comp_009
    question: "Show the distribution of absorption relative to black carbon"
    expected_query_contains: ["Abs637", "BC637"]
    expected_columns: ["Abs637", "BC637"]
    expected_query: "df.assign(abs_bc_ratio=df['Abs637'] / df['BC637'])[['abs_bc_ratio']]"
    expected_viz: "histogram"
    expected_x: "abs_bc_ratio"
    expected_y: null
    category: "computed"
  - id: comp_010
    question: "Plot blue scattering normalized by particle number over time"
    expected_query_contains: ["scat450", "conc"]
    expected_columns: ["time", "scat450", "conc"]
    expected_query: "df[['time']].assign(scat_per_particle=df['scat450'] / df['conc'])"
    expected_viz: "line"
    expected_x: "time"
    expected_y: "scat_per_particle"
    category: "computed"

